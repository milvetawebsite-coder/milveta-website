    <script>

        function openWhatsApp(event) {

            event.preventDefault();


            /* Owner WhatsApp number */

            const phoneNumber =
                "917892029691";


            /*
             * Create emojis using Unicode.
             * This prevents the � problem.
             */

            const wavingHand =
                String.fromCodePoint(0x1F44B);

            const wheat =
                String.fromCodePoint(0x1F33E);

            const smilingFace =
                String.fromCodePoint(0x1F60A);


            /*
             * WhatsApp message
             */

            const message =
                "Hello Milveta! " +
                wavingHand +
                "\n" +

                "I’d like to order Milveta Multi Millet Powder. " +
                wheat +
                "\n" +

                "Please share the available pack sizes, price, and ordering details. Thank you! " +
                smilingFace;


            /*
             * Create WhatsApp URL
             */

            const whatsappURL =
                "https://wa.me/" +
                phoneNumber +
                "?text=" +
                encodeURIComponent(message);


            /*
             * Open WhatsApp
             */

            window.open(
                whatsappURL,
                "_blank"
            );

        }

    </script>



    <!-- =====================================================
         MOBILE BANNER HOTSPOT POSITIONING
    ====================================================== -->

    <script>

        (function () {


            const image =
                document.getElementById(
                    "mobileBannerImage"
                );


            const wrapper =
                document.getElementById(
                    "mobileBannerWrapper"
                );


            const hotspots =
                document.querySelectorAll(
                    ".mobile-platform-hotspot"
                );


            function positionHotspots() {


                /*
                 * Only run this calculation
                 * on mobile.
                 */

                if (window.innerWidth > 768) {

                    return;

                }


                if (!image || !wrapper) {

                    return;

                }


                const wrapperWidth =
                    wrapper.clientWidth;


                const wrapperHeight =
                    wrapper.clientHeight;


                const originalWidth =
                    image.naturalWidth;


                const originalHeight =
                    image.naturalHeight;


                if (
                    !originalWidth ||
                    !originalHeight
                ) {

                    return;

                }


                /*
                 * Calculate the scale used
                 * by object-fit: cover.
                 */

                const scale =
                    Math.max(
                        wrapperWidth / originalWidth,
                        wrapperHeight / originalHeight
                    );


                const displayedWidth =
                    originalWidth * scale;


                const displayedHeight =
                    originalHeight * scale;


                /*
                 * Calculate how much of the
                 * image is cropped.
                 */

                const offsetX =
                    (wrapperWidth -
                        displayedWidth) / 2;


                const offsetY =
                    (wrapperHeight -
                        displayedHeight) / 2;


                /*
                 * Position every clickable area.
                 */

                hotspots.forEach(
                    function (hotspot) {


                        const x =
                            parseFloat(
                                hotspot.dataset.x
                            );


                        const y =
                            parseFloat(
                                hotspot.dataset.y
                            );


                        const width =
                            parseFloat(
                                hotspot.dataset.width
                            );


                        const height =
                            parseFloat(
                                hotspot.dataset.height
                            );


                        const left =
                            offsetX +
                            (x / 100) *
                            displayedWidth;


                        const top =
                            offsetY +
                            (y / 100) *
                            displayedHeight;


                        const hotspotWidth =
                            (width / 100) *
                            displayedWidth;


                        const hotspotHeight =
                            (height / 100) *
                            displayedHeight;


                        hotspot.style.left =
                            left + "px";


                        hotspot.style.top =
                            top + "px";


                        hotspot.style.width =
                            hotspotWidth + "px";


                        hotspot.style.height =
                            hotspotHeight + "px";


                    }
                );

            }


            /*
             * Position after image loads.
             */

            if (image) {

                if (image.complete) {

                    positionHotspots();

                }


                image.addEventListener(
                    "load",
                    positionHotspots
                );

            }


            /*
             * Recalculate when the phone
             * changes orientation or size.
             */

            window.addEventListener(
                "resize",
                positionHotspots
            );


            window.addEventListener(
                "orientationchange",
                function () {

                    setTimeout(
                        positionHotspots,
                        250
                    );

                }
            );


        })();

    </script>

                    const isOpen =
