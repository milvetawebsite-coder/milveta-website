<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Milveta International | Contact Us
    </title>


    <!-- GOOGLE FONT -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- CONTACT US CSS -->

    <link
        rel="stylesheet"
        href="css/contactus.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="contact-header">


        <!-- BACK TO HOME -->

        <a
            href="index.html"
            class="back-button">

            <i class="fa-solid fa-arrow-left"></i>

            <span>
                Back to Home
            </span>

        </a>


        <!-- PAGE TITLE -->

        <div class="contact-title">

            <h1>
                Contact Us
            </h1>

            <p>
                MILVETA INTERNATIONAL
            </p>

        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="contact-main">


        <!-- =================================================
             PAGE HEADING
        ================================================== -->

        <section class="page-heading">


            <div class="heading-icon">

                <i class="fa-solid fa-envelope"></i>

            </div>


            <h2>
                Contact Us
            </h2>


            <p>
                Get in touch with Milveta International
                for more information and enquiries.
            </p>

        </section>



        <!-- =================================================
             CANVA CONTACT DESIGN
        ================================================== -->

        <section class="canva-section">


            <div class="canva-card">


                <div class="canva-container">


                    <iframe
                        loading="lazy"
                        src="https://www.canva.com/design/DAHS03g1C9A/QAieWOTxnJLuvyyyBjeY7g/view?embed"
                        title="Milveta International Contact Us"
                        allowfullscreen
                        allow="fullscreen">
                    </iframe>


                </div>

            </div>

        </section>



        <!-- =================================================
             OPEN CANVA BUTTON
        ================================================== -->

        <section class="canva-open-section">


            <p>
                Want to view the design directly on Canva?
            </p>


            <a
                href="https://www.canva.com/design/DAHS03g1C9A/QAieWOTxnJLuvyyyBjeY7g/view"
                target="_blank"
                rel="noopener noreferrer"
                class="open-canva-button">

                <i class="fa-solid fa-up-right-from-square"></i>

                Open Contact Us

            </a>


        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="contact-footer">

        <p>
            © 2026 Milveta International.
            All Rights Reserved.
        </p>

    </footer>


</body>

</html>
